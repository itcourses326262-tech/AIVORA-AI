name: CI

# No secrets are needed: every job runs with the Demo provider, a throw-away database and no
# payment, e-mail or AI keys. Nothing is published or deployed from here.
#
# It runs on every push to EVERY branch, not only `main`: the work happens on feature branches, and a
# filter naming a branch that does not exist (the repository was created without a `main`) means that no
# run ever starts. The branch of a pull request lives in this repository, so its pushes are covered too;
# a `pull_request` trigger on top would build and test every update twice. Pull requests from forks
# therefore do not run (the repository is private); add `pull_request:` back if that changes.
# It can also be started by hand from the Actions tab.
on:
  push:
    branches: ['**']
  workflow_dispatch:

# A new push to the same branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the jobs only read the repository.
permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  static:
    name: Lint, types, formatting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      # `next typegen` first (it writes the typed-route helpers), then `tsc --noEmit`.
      - run: npm run typecheck
      - run: npx prettier --check .

  unit:
    name: Unit and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The suites that need a real browser (layout, touch targets, axe with layout) skip themselves
      # when no Chromium is configured; the e2e job below runs them.
      # --testTimeout: Vitest's default of 5 s is too tight for a few CPU-bound tests on a shared runner
      # (the moderation rule data check takes about 3 s on an idle 4-core machine and failed at 5 s under
      # load); a real hang still ends at 30 s, well inside the job's timeout.
      - run: npm test -- --testTimeout=30000

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # No environment variables are needed to build: the configuration is parsed at the first request.
      - run: npm run build
      - name: The standalone server and its assets exist
        run: |
          test -f .next/standalone/server.js
          test -d .next/standalone/drizzle
          test -d .next/static
          ls .next/standalone/node_modules | grep -x better-sqlite3
          ls .next/standalone/node_modules | grep -x sharp

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # playwright.config.ts builds the app and starts it in production mode on a scratch database
      # (Demo provider, no keys), then runs e2e/.
      - run: npm run test:e2e
      - name: Browser layout tests (advisory)
        # The seven tests/components/**/*.layout.test.tsx suites need a real Chromium. They were written
        # against the older Chromium of the development sandbox, so a failure here is reported but does
        # not fail the run until it has been seen green on a GitHub runner.
        continue-on-error: true
        run: |
          export PW_CHROMIUM_PATH="$(node -e "process.stdout.write(require('@playwright/test').chromium.executablePath())")"
          npx vitest run layout.test
      - name: Upload the report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  docker:
    name: Docker image smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: aivore:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # SIGNUP_BONUS_PROVIDER=any funds the smoke account: by default only Google sign-up earns the free
      # credits and a password account starts with none.
      - name: Start the container the way a production host does
        run: |
          docker run -d --name aivore --init -p 3000:3000 \
            -e APP_URL=http://localhost:3000 \
            -e SESSION_SECRET="$(openssl rand -hex 32)" \
            -e TRUST_PROXY=true \
            -e SIGNUP_BONUS_PROVIDER=any \
            aivore:ci
      - name: Register, generate with the Demo provider, download, check credits
        run: bash .github/scripts/smoke.sh http://localhost:3000
      - name: The container reports healthy and runs as an unprivileged user
        run: |
          for i in $(seq 1 24); do
            status="$(docker inspect --format '{{.State.Health.Status}}' aivore)"
            [ "$status" = healthy ] && break
            sleep 5
          done
          test "$status" = healthy
          test "$(docker exec aivore id -u)" != 0
      - name: The bundled command-line tools work inside the image
        run: |
          docker exec aivore node scripts/migrate.mjs
          docker exec aivore node scripts/admin.mjs users-stats
          docker exec aivore node scripts/backup.mjs --keep 2
          backup="$(docker exec aivore sh -c 'ls -d /data/backups/aivore-* | tail -n 1')"
          docker exec aivore node scripts/restore.mjs --from "$backup" --check
      - name: SIGTERM stops the server cleanly
        run: |
          docker stop -t 30 aivore
          test "$(docker inspect --format '{{.State.ExitCode}}' aivore)" = 143
      - name: Container logs
        if: always()
        run: docker logs aivore || true
